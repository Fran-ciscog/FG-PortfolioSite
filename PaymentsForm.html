<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">  <!-- use ? -->

    <link rel="icon" type="image/x-icon" href="El Güegüense_El Toro Huaco.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title> Payments Form Project </title>

    <!-- <script src="scripts.js" defer> </script>
    <script src="/JavaScript/PaymentsFormScripts.js"> </script>  use here ?? -->

</head>

<body>
<header>
<br>
    <a href="Projects.html">
        <img src="abstract-blue-white-grey-squares-geometric-background.jpg" alt="logo pic" class="logo" style="height: 60px; width: 60px; border-radius: 30px; padding: 4px; background-color: blue;">
              
    <a href="index.html"> | Home | </a>
</header>    

<br>
<hr>
    

    <div class="container">
        <br>
    <div class="card-container">

        <div class="front">
            <div class="image">
                <img src="chip.png" alt="card chip img">
               <!-- <img src="images/visa.png" alt="Visa card logo pic"> -->
            </div>

            <div class="card-number-box"> ################ </div>
            <div class="flexbox">
                <div class="box">
                    <span> Card Holder </span>
                    <div class="card-holder-name"> Full Name </div>
                </div>

                <div class="box">
                    <span> Expires </span>
                    <div class="expiration">
                        <span class="exp-month"> MM </span>
                        <span class="exp-year"> YY </span>
                    </div>
                </div>
            </div>
        </div>

        <div class="back">
            <div class="stripe"></div>
            <div class="box">
                <span> CVV </span>
                <div class="cvv-box"></div>
               <!-- <img src="images/visa.png" alt="Visa card logo pic"> -->
            </div>
        </div>

    </div>

    <form action="">
        <div class="inputBox">
            <span> Card Number </span>
            <input type="text" maxlength="16" class="card-number-input">
        </div>

        <div class="inputBox">
            <span> Card Holder </span>
            <input type="text" class="card-holder-input">
        </div>

        <div class="flexbox">
            <div class="inputBox">
                <span> Expiration MM </span>
                <select name="" id="" class="month-input">
                    <option value="month" selected disabled> month </option>
                    <option value="01">01</option>
                    <option value="02">02</option>
                    <option value="03">03</option>
                    <option value="04">04</option>
                    <option value="05">05</option>
                    <option value="06">06</option>
                    <option value="07">07</option>
                    <option value="08">08</option>
                    <option value="09">09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </div>

            <div class="inputBox">
                <span> Expiration YY </span>
                <select name="" id="" class="year-input">
                    <option value="year" selected disabled> year </option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                    <option value="2031">2031</option>
                    <option value="2032">2032</option>
                </select>
            </div>           

            <div class="inputBox">
                <span> CVV </span>
                <input type="text" maxlength="3" class="cvv-input">
            </div>

            <div class="inputBox">
                <span> zip code </span>
                <input type="text" maxlength="5" class="zipcode-input">
            </div>
        </div>

            <div class="inputBox">
                <span> Email </span>
                <input type="text">
            </div> 
            <!-- add a "href mailto:" code here ?? " -->

        <input type="submit" value="submit" class="submit-btn">
    </form>
    <br>

    <p style="color: blue; font-size: large;"> Thank You! </p>
    <br>
    
    <p style="font-size: large; color: gray;"> We accept </p>
    <p style="font-size: larger;">
        <i class="fa-brands fa-cc-visa"> </i> | <i class="fa-brands fa-cc-mastercard"> </i> | <i class="fa-brands fa-google-pay"> </i> | <i class="fa-brands fa-cc-apple-pay"> </i> <br>
        <br> 
        <p style="color: gray;"> Trusted by </p> 
        <i class="fa-brands fa-cc-paypal"> </i> 
    </p>
</div>
<br>

<!-- Footer --> 
<footer>
    <p>
      Web Designs by &lt; Fg &gt; <sup> &copy; </sup> All Rights Reserved.
      Last updated &lbrack; Aug | 2026 &rbrack;
    </p>
</footer>

<script>

document.querySelector('.card-number-input').oninput = () =>{
    document.querySelector('.card-number-box').innerText = document.querySelector('.card-number-input').value;
}

document.querySelector('.card-holder-input').oninput = () =>{
    document.querySelector('.card-holder-name').innerText = document.querySelector('.card-holder-input').value;
}

document.querySelector('.month-input').oninput = () =>{
    document.querySelector('.exp-month').innerText = document.querySelector('.month-input').value;
}

document.querySelector('.year-input').oninput = () =>{
    document.querySelector('.exp-year').innerText = document.querySelector('.year-input').value;
}

document.querySelector('.cvv-input').onmouseenter = () =>{
    document.querySelector('.front').style.transform = 'perspective(1000px) rotateY(-180deg)';
    document.querySelector('.back').style.transform = 'perspective(1000px) rotateY(0deg)';
}

document.querySelector('.cvv-input').onmouseleave = () =>{
    document.querySelector('.front').style.transform = 'perspective(1000px) rotateY(0deg)';
    document.querySelector('.back').style.transform = 'perspective(1000px) rotateY(180deg)';
}

document.querySelector('.cvv-input').oninput = () =>{
    document.querySelector('.cvv-box').innerText = document.querySelector('.cvv-input').value;
}

</script>


</body>
</html>
